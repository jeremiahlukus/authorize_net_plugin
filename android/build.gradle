group 'com.jparrack.authorize_net_plugin'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Hosts the AuthorizeNet Android SDK.
        maven { url = "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.jparrack.authorize_net_plugin"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 26
    }
}

dependencies {
    // `api` rather than `implementation`: AuthorizeNetPlugin implements the SDK's
    // EncryptTransactionCallback, so the SDK has to be on the consumer's compile
    // classpath too. Consumers only need to add the jitpack repository.
    api 'com.github.AuthorizeNet:accept-sdk-android:1.04'
}
